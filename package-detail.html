<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Багцын дэлгэрэнгүй — Monde Tour</title>
  <meta name="description" content="Monde Tour амралтын газрын багцын дэлгэрэнгүй мэдээлэл, үнэ, багтсан үйлчилгээ.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .pd-side-card { background: var(--surface); border: 1px solid var(--neutral-200); border-radius: var(--radius-xl); padding: 1.75rem; position: sticky; top: 110px; }
    .pd-price-row { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--neutral-200); border-bottom: 1px solid var(--neutral-200); padding: 1rem 0; margin-bottom: 1.25rem; }
    .pd-includes { list-style: none; padding: 0; margin: 0 0 1.5rem; }
    .pd-includes li { padding: .5rem 0 .5rem 1.1rem; position: relative; color: var(--neutral-600); font-size: .9375rem; }
    .pd-includes li::before { content: '•'; position: absolute; left: .25rem; color: var(--green-600); }
    .pd-chip { display: inline-flex; align-items: center; gap: .5rem; background: var(--beige-100); border-radius: 999px; padding: .625rem 1.125rem; font-size: .875rem; color: var(--neutral-800); }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div id="mobile-cta-placeholder"></div>

  <main>
    <section class="section" style="padding-top:130px">
      <div class="container">
        <div id="package-detail"></div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/erxes-client.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await loadErxesData();
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const data = getData();
      const lang = getLang();
      const pkg = data.packages.find(p => p.id === id) || data.packages[0];

      document.title = `${pkg.name} — Monde Tour`;

      const L = lang === 'en' ? {
        back: '← All packages', info: 'Information', price: 'Package Price',
        includes: 'What\'s Included', book: 'Book Package',
        meta: { people: 'People', duration: 'Duration', type: 'Type' }
      } : {
        back: '← Бүх багц', info: 'Мэдээлэл', price: 'Багцын үнэ',
        includes: 'Багцад багтсан', book: 'Багц захиалах',
        meta: { people: 'Хүний тоо', duration: 'Хугацаа', type: 'Төрөл' }
      };

      const typeLabels = {
        family: lang === 'en' ? 'Family' : 'Гэр бүлийн',
        couple: lang === 'en' ? 'Couple' : 'Хосуудын',
        corporate: lang === 'en' ? 'Corporate' : 'Байгууллагын',
        event: 'Event'
      };

      const detail = document.getElementById('package-detail');
      detail.innerHTML = `
        <a href="packages.html" class="text-muted" style="display:inline-flex;align-items:center;gap:0.5rem;margin-bottom:1.5rem">${L.back}</a>
        <h1 style="font-size:clamp(1.75rem,3.5vw,2.5rem);margin-bottom:0.75rem">${escapeHtml(pkg.name)}</h1>
        <p style="font-size:1.0625rem;color:var(--neutral-600);line-height:1.8;max-width:900px;margin-bottom:2rem">${escapeHtml(pkg.description)}</p>

        <div class="grid" style="grid-template-columns:1fr 340px;gap:2.5rem;align-items:start" id="pd-layout">
          <div>
            <div style="border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-xl);height:clamp(280px,38vw,440px)">
              <img src="${escapeHtml(pkg.image)}" alt="${escapeHtml(pkg.name)}" style="width:100%;height:100%;object-fit:cover;display:block">
            </div>

            <div style="display:flex;flex-wrap:wrap;gap:0.625rem;margin-top:2rem">
              <span class="pd-chip">👥 ${escapeHtml(pkg.people)}</span>
              <span class="pd-chip">⏱️ ${escapeHtml(pkg.duration)}</span>
              <span class="pd-chip">🏷️ ${typeLabels[pkg.type] || escapeHtml(pkg.type)}</span>
            </div>

            <h3 style="margin-top:2.5rem;margin-bottom:1rem">${L.includes}</h3>
            <div style="display:flex;flex-wrap:wrap;gap:0.625rem">
              ${pkg.includes.map(i => `<span class="pd-chip">✓ ${escapeHtml(i)}</span>`).join('')}
            </div>
          </div>

          <div class="pd-side-card">
            <h3 style="margin:0 0 0.25rem;font-size:1.25rem">${L.info}</h3>
            <div class="pd-price-row">
              <span style="font-weight:600;color:var(--neutral-800)">${L.price}:</span>
              <span style="font-size:1.375rem;font-weight:700;color:var(--green-700)">${formatPrice(pkg.price)}</span>
            </div>
            <ul class="pd-includes">
              <li>${L.meta.people}: ${escapeHtml(pkg.people)}</li>
              <li>${L.meta.duration}: ${escapeHtml(pkg.duration)}</li>
              <li>${L.meta.type}: ${typeLabels[pkg.type] || escapeHtml(pkg.type)}</li>
            </ul>
            <a href="booking.html?package=${pkg.id}" class="btn btn-primary btn-lg" style="width:100%">${L.book}</a>
          </div>
        </div>
      `;

      const layout = document.getElementById('pd-layout');
      const applyLayout = () => {
        layout.style.gridTemplateColumns = window.innerWidth <= 900 ? '1fr' : '1fr 340px';
      };
      applyLayout();
      window.addEventListener('resize', applyLayout);
    });
  </script>
</body>
</html>
