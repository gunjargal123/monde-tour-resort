<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Арга хэмжээ — Monde Tour</title>
  <meta name="description" content="Monde Tour дэх хурим, team building, байгууллагын event, гэр бүлийн баярын үйлчилгээ.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <div id="mobile-cta-placeholder"></div>

  <main>
    <section class="page-header">
      <div class="page-header-bg">
        <img src="images/camp-overview.jpg" alt="Monde Tour event">
      </div>
      <div class="page-header-overlay"></div>
      <div class="container page-header-content">
        <span class="section-label" style="color:var(--green-300)" data-i18n="nav_events">Арга хэмжээ</span>
        <h1 class="page-header-title" id="events-title">Арга хэмжээний үйлчилгээ</h1>
        <p class="page-header-desc" id="events-desc">Хурим, team building, гэр бүлийн баяр — байгаль дундах онцгой арга хэмжээ</p>
      </div>
    </section>

    <div id="events-content"></div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const data = getData();
      const lang = getLang();
      let events = lang === 'en' && data.eventsEn ? data.eventsEn : data.events;

      // Merge Erxes CMS content for events if available
      events = events.map(evt => {
        const cmsKey = lang === 'en' && data.cms?.[evt.category + 'En'] ? evt.category + 'En' : evt.category;
        const cms = data.cms?.[cmsKey];
        if (cms && cms.content) {
          return { ...evt, title: cms.title || evt.title, description: cms.content, _source: 'erxes' };
        }
        return evt;
      });

      // Header text
      if (lang === 'en') {
        document.getElementById('events-title').textContent = 'Event Services';
        document.getElementById('events-desc').textContent = 'Weddings, team building, and family celebrations in the heart of nature';
      }

      const labels = {
        corporate: { mn: 'Байгууллагын event', en: 'Corporate Events' },
        wedding: { mn: 'Хурим', en: 'Wedding' },
        family: { mn: 'Гэр бүлийн баяр', en: 'Family Celebration' }
      };

      const buttons = {
        corporate: { mn: 'Үнийн санал авах', en: 'Request quotation' },
        wedding: { mn: 'Хурим захиалах', en: 'Book wedding' },
        family: { mn: 'Баяр захиалах', en: 'Book celebration' }
      };

      const images = {
        corporate: 'images/camp-entrance.jpg',
        wedding: 'images/camp-overview.jpg',
        family: 'images/camp-gers.jpg'
      };

      const container = document.getElementById('events-content');
      container.innerHTML = events.map((evt, i) => `
        <section class="section ${i % 2 === 1 ? 'section-sm' : ''}" style="${i % 2 === 1 ? 'background:var(--beige-100)' : ''}" id="${evt.category}">
          <div class="container">
            <div class="grid grid-2 ${i % 2 === 1 ? 'grid-feature-reverse' : 'grid-feature'}" style="align-items:center;gap:3rem">
              ${i % 2 === 1 ? `
              <div>
                <img src="${images[evt.category]}" alt="${escapeHtml(evt.title)}" style="border-radius:var(--radius-xl);box-shadow:var(--shadow-xl);width:100%;height:auto">
              </div>
              ` : ''}
              <div>
                <span class="section-label">${labels[evt.category][lang] || labels[evt.category].mn}</span>
                <h2 class="section-title">${escapeHtml(evt.title)}</h2>
                <p>${evt._source === 'erxes' ? evt.description : escapeHtml(evt.description)}</p>
                <ul class="feature-list mt-6">
                  ${evt.features.map(f => `<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>${escapeHtml(f)}</li>`).join('')}
                </ul>
                <a href="booking.html?service=${evt.category}" class="btn btn-primary mt-6">${buttons[evt.category][lang] || buttons[evt.category].mn}</a>
              </div>
              ${i % 2 === 0 ? `
              <div>
                <img src="${images[evt.category]}" alt="${escapeHtml(evt.title)}" style="border-radius:var(--radius-xl);box-shadow:var(--shadow-xl);width:100%;height:auto">
              </div>
              ` : ''}
            </div>
          </div>
        </section>
      `).join('');
    });
  </script>
</body>
</html>
