<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Өрөөний дэлгэрэнгүй — Monde Tour</title>
  <meta name="description" content="Monde Tour амралтын газрын өрөөний дэлгэрэнгүй мэдээлэл, үнэ, тохижилт.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .rd-gallery { display: block; }
    .rd-thumb { display: none; }
    .rd-main { position: relative; border-radius: var(--radius-lg); overflow: hidden; }
    .rd-main img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .rd-nav-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(255,255,255,.92); color: var(--neutral-800); font-size: 1.375rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); z-index: 2; }
    .rd-nav-btn:hover { background: #fff; }
    .rd-dots { position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%); display: flex; gap: .5rem; z-index: 2; background: rgba(0,0,0,.25); padding: .375rem .625rem; border-radius: 999px; backdrop-filter: blur(4px); }
    .rd-dot { width: 22px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.55); cursor: pointer; border: none; padding: 0; transition: background .2s; }
    .rd-dot.active { background: #fff; }
    .rd-side-card { background: var(--surface); border: 1px solid var(--neutral-200); border-radius: var(--radius-xl); padding: 1.75rem; position: sticky; top: 110px; }
    .rd-price-row { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--neutral-200); border-bottom: 1px solid var(--neutral-200); padding: 1rem 0; margin-bottom: 1.25rem; }
    .rd-extra { list-style: none; padding: 0; margin: 0 0 1.5rem; }
    .rd-extra li { padding: .5rem 0 .5rem 1.1rem; position: relative; color: var(--neutral-600); font-size: .9375rem; }
    .rd-extra li::before { content: '•'; position: absolute; left: .25rem; color: var(--green-600); }
    .rd-amenity { display: inline-flex; align-items: center; gap: .5rem; background: var(--beige-100); border-radius: 999px; padding: .625rem 1.125rem; font-size: .875rem; color: var(--neutral-800); }
    .rd-rules { list-style: none; padding: 0; margin: 0; }
    .rd-rules li { padding: .6rem 0 .6rem 1.25rem; position: relative; color: var(--neutral-600); line-height: 1.7; }
    .rd-rules li::before { content: '•'; position: absolute; left: .25rem; color: var(--green-600); }
    @media (max-width: 900px) {
      .rd-gallery { grid-template-columns: 1fr; }
      .rd-thumb { display: none; }
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div id="mobile-cta-placeholder"></div>

  <main>
    <section class="section" style="padding-top:130px">
      <div class="container">
        <div id="room-detail"></div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <div class="lightbox">
    <button class="lightbox-close">✕</button>
    <button class="lightbox-prev">‹</button>
    <img src="" alt="">
    <button class="lightbox-next">›</button>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/erxes-client.js"></script>
  <script>
    let rdImages = [];
    let rdIndex = 0;

    document.addEventListener('DOMContentLoaded', async () => {
      await loadErxesData();
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const data = getData();
      const lang = getLang();
      const room = data.rooms.find(r => r.id === id) || data.rooms[0];

      document.title = `${room.name} — Monde Tour`;

      const L = lang === 'en' ? {
        back: '← All rooms', info: 'Information', perNight: 'Per Night',
        extras: 'Extra Services', book: 'Book Room', amenities: 'Amenities',
        rules: 'Room Rules', guests: 'guests',
        extrasList: ['Breakfast', 'Guided nature walk', 'Bonfire setup', 'Traditional food experience'],
        rulesList: [
          'No smoking inside the room. Designated smoking areas are available outside.',
          'Please conserve water and electricity by turning off lights and appliances when not in use.',
          'Guests are responsible for locking the doors and securing their belongings.'
        ]
      } : {
        back: '← Бүх өрөө', info: 'Мэдээлэл', perNight: 'Нэг шөнө',
        extras: 'Нэмэлт үйлчилгээ', book: 'Өрөө захиалах', amenities: 'Тавилга',
        rules: 'Дүрэм журам', guests: 'хүн',
        extrasList: ['Өглөөний цай', 'Байгалийн хөтөчтэй алхалт', 'Галын түүдэг', 'Уламжлалт хоолны туршлага'],
        rulesList: [
          'Өрөөнд тамхи татахыг хориглоно. Гадна тусгайлсан татах газар байна.',
          'Хэрэглэж байгаагүй үед гэрэл, цахилгаан хэрэгслийг унтрааж, ус, цахилгаан хэмнэнэ үү.',
          'Зочид хаалгаа тээглэж, эд зүйлсээ хамгаалах үүрэгтэй.'
        ]
      };

      rdImages = room.images && room.images.length ? room.images : ['images/camp-gers.jpg'];
      rdIndex = 0;

      const detail = document.getElementById('room-detail');
      detail.innerHTML = `
        <a href="rooms.html" class="text-muted" style="display:inline-flex;align-items:center;gap:0.5rem;margin-bottom:1.5rem">${L.back}</a>
        <h1 style="font-size:clamp(1.75rem,3.5vw,2.5rem);margin-bottom:0.75rem;text-transform:none">${escapeHtml(room.name)}</h1>
        <p style="font-size:1.0625rem;color:var(--neutral-600);line-height:1.8;max-width:900px;margin-bottom:2rem">${escapeHtml(room.description)}</p>

        <div class="grid" style="grid-template-columns:1fr 340px;gap:2.5rem;align-items:start" id="rd-layout">
          <div>
            <div class="rd-gallery">
              <div class="rd-main" style="aspect-ratio:21/9;height:auto">
                <img id="rd-main-img" src="" alt="">
                <button class="rd-nav-btn" style="left:1rem" onclick="rdPrev()">‹</button>
                <button class="rd-nav-btn" style="right:1rem" onclick="rdNext()">›</button>
                <div class="rd-dots" id="rd-dots"></div>
              </div>
            </div>

            <p style="margin-top:2rem;color:var(--neutral-600);line-height:1.8">${escapeHtml(room.shortDesc || room.description)}</p>

            <h3 style="margin-top:2.5rem;margin-bottom:1rem">${L.amenities}</h3>
            <div style="display:flex;flex-wrap:wrap;gap:0.625rem">
              ${room.facilities.map(f => `<span class="rd-amenity">✦ ${escapeHtml(f)}</span>`).join('')}
              <span class="rd-amenity">👥 ${room.capacity}–${room.capacity + 2} ${L.guests}</span>
            </div>

            <h3 style="margin-top:2.5rem;margin-bottom:1rem">${L.rules}</h3>
            <ul class="rd-rules">
              ${L.rulesList.map(r => `<li>${escapeHtml(r)}</li>`).join('')}
            </ul>
          </div>

          <div class="rd-side-card">
            <h3 style="margin:0 0 0.25rem;font-size:1.25rem">${L.info}</h3>
            <div class="rd-price-row">
              <span style="font-weight:600;color:var(--neutral-800)">${L.perNight}:</span>
              <span style="font-size:1.375rem;font-weight:700;color:var(--green-700)">${formatPrice(room.price)}</span>
            </div>
            <h4 style="margin:0 0 0.25rem;font-size:1rem">${L.extras}</h4>
            <ul class="rd-extra">
              ${L.extrasList.map(e => `<li>${escapeHtml(e)}</li>`).join('')}
            </ul>
            <a href="booking.html?room=${room.id}" class="btn btn-primary btn-lg" style="width:100%">${L.book}</a>
          </div>
        </div>
      `;

      renderGallery();

      const layout = document.getElementById('rd-layout');
      if (window.innerWidth <= 900) layout.style.gridTemplateColumns = '1fr';
      window.addEventListener('resize', () => {
        layout.style.gridTemplateColumns = window.innerWidth <= 900 ? '1fr' : '1fr 340px';
      });
    });

    function renderGallery() {
      const main = document.getElementById('rd-main-img');
      const dots = document.getElementById('rd-dots');
      if (!main) return;
      main.src = rdImages[rdIndex];
      dots.innerHTML = rdImages.map((_, i) =>
        `<button class="rd-dot ${i === rdIndex ? 'active' : ''}" onclick="rdGo(${i})" aria-label="image ${i + 1}"></button>`
      ).join('');
    }

    function rdGo(i) { rdIndex = i; renderGallery(); }
    function rdPrev() { rdIndex = (rdIndex - 1 + rdImages.length) % rdImages.length; renderGallery(); }
    function rdNext() { rdIndex = (rdIndex + 1) % rdImages.length; renderGallery(); }
  </script>
</body>
</html>
